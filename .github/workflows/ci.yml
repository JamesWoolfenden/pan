name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # librosa/audioread need libsndfile at runtime for most audio decoding, same as the Dockerfile.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The committed VERSION is only ever as fresh as the last time someone wrote it by hand -
      # stamp the real commit so /version on the deployed image is trustworthy.
      - name: Stamp version
        run: git rev-parse --short HEAD > VERSION

      - name: Build image
        run: docker build --label org.opencontainers.image.source=https://github.com/JamesWoolfenden/pan -t pan:ci .

      # Catches import-time failures (e.g. a bad DB migration) that only show up once the
      # container actually starts, not just from the build succeeding.
      - name: Smoke test container
        run: |
          docker run -d --name pan-smoke -p 8000:8000 pan:ci
          ok=
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/ -o /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs pan-smoke
          docker stop pan-smoke
          [ -n "$ok" ] || { echo "Container never became healthy"; exit 1; }

      # Only images that passed the tests and smoke test above get published - `make deploy` pulls
      # the :<sha> tag, :latest is just for a fresh first-time setup.
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ghcr.io/jameswoolfenden/pan
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag pan:ci "$IMAGE:$SHA"
          docker tag pan:ci "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
