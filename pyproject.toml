[project]
name = "pan"
version = "0.1.0"
description = "AI-enabled search and tagging for a Plex + local-file music library"
authors = [
    { name = "James Woolfenden", email = "james.woolfenden@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "plexapi>=4.16",
    "mutagen>=1.47",
    "librosa>=0.10",
    "sentence-transformers>=3.3",
    # Listed directly (it's already a sentence-transformers dependency) only so the CPU-only
    # [tool.uv.sources] override below applies - uv ignores sources for transitive deps.
    "torch",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "audioread>=3.1.0",
    "pyloudnorm>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.uv]
package = false

# PyPI's Linux torch wheels bundle ~3 GB of NVIDIA CUDA libraries (pulled in via
# sentence-transformers); the NAS has no GPU, so the Docker image takes the CPU-only build.
# Windows torch from PyPI is already CPU-only, so local dev is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
