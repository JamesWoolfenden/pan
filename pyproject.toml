[project]
name = "pan"
version = "0.1.0"
description = "AI-enabled search and tagging for a Plex + local-file music library"
authors = [
    { name = "James Woolfenden", email = "james.woolfenden@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "plexapi>=4.16",
    "mutagen>=1.47",
    "librosa>=0.10",
    "sentence-transformers>=3.3",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "audioread>=3.1.0",
    "pyloudnorm>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
