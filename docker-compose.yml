# Synology (Container Manager) deployment: pan + a Tailscale sidecar. pan is reachable two ways:
# on the home LAN at http://<NAS LAN IP>:8080 (plain HTTP, no Tailscale needed), and from anywhere
# at a private HTTPS address on your tailnet (https://pan.<your-tailnet>.ts.net) via the sidecar,
# with no port-forwarding and no public exposure. See README.md "Deploying elsewhere".
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: pan
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Userspace networking: tailscaled never touches /dev/net/tun, since some Synology
      # kernels don't expose the tun module to Docker. We only need inbound access via
      # `tailscale serve` to a localhost port (handled fine in this mode) - not full tailnet
      # routing - so this has no downside for this deployment.
      - TS_USERSPACE=true
      # Applies tailscale-config/serve.json on every startup, so `tailscale serve` never needs
      # to be run by hand again after a container recreate.
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      # Mounted as a directory, not a single file - Tailscale watches the directory for changes
      # to pick up edits, which doesn't work reliably against a single-file bind mount.
      - ./tailscale-config:/config
    restart: unless-stopped

  pan:
    # Built by CI on every push to master (.github/workflows/ci.yml), tagged with the full commit
    # SHA. `make deploy` replaces whatever tag/digest is here with that commit's tag *and* its
    # digest (scripts/image_digest.py) in the copy it ships, so the NAS always runs a
    # digest-pinned image - :latest here is only a placeholder. Rollback is
    # `make deploy TAG=<older sha>`.
    # holden:ignore:HLD_DC_001
    # holden:ignore:HLD_DC_007
    image: ghcr.io/jameswoolfenden/pan:latest
    # Own network namespace, published on the NAS's LAN port 8080 (plain HTTP). The tailscale
    # sidecar reaches it by service name (tailscale-config/serve.json proxies to http://pan:8000).
    # Plain HTTP on the LAN means Basic Auth credentials aren't encrypted there - set
    # PAN_AUTH_USER/PAN_AUTH_PASSWORD in .env, since anyone on the LAN can reach this port.
    ports:
      - "8080:8000"
    env_file:
      - .env
    volumes:
      - ./pan.db:/app/pan.db
      # NAS_MUSIC_PATH (set in .env) is the host-side path to your music share; SHARED_DRIVE_PATH
      # in .env must then be set to /music (the path as pan sees it inside the container) -
      # these are deliberately two different variables, see README.
      - ${NAS_MUSIC_PATH}:/music:ro
    restart: unless-stopped
