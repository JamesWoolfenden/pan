<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pan</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>pan</h1>
    <button id="reindex-btn">Reindex library</button>
    <span id="reindex-status"></span>
  </header>

  <main>
    <section id="queue-panel">
      <div id="queue-header">
        <strong>Queue</strong>
        <span id="queue-now-playing"></span>
        <div id="queue-controls">
          <button id="queue-shuffle" disabled title="Shuffle">&#128256;</button>
          <button id="queue-prev" disabled>&#9664;&#9664;</button>
          <button id="queue-playpause" disabled>&#9654;</button>
          <button id="queue-next" disabled>&#9654;&#9654;</button>
          <button id="queue-repeat" disabled title="Repeat off">&#128257;</button>
          <google-cast-launcher id="cast-button"></google-cast-launcher>
          <button id="queue-save" disabled>Save as playlist</button>
          <button id="queue-clear" disabled>Clear</button>
        </div>
      </div>
      <div id="queue-now-playing-actions" hidden></div>
      <audio id="queue-player" controls></audio>
      <ol id="queue-list"></ol>
    </section>

    <section id="playlists-panel">
      <div id="playlists-header">
        <strong>Playlists</strong>
      </div>
      <ul id="playlists-list"></ul>
    </section>

    <section id="stats-panel">
      <strong>Stats</strong>
      <button id="stats-recently-played">Recently played</button>
      <button id="stats-favorites">Favorites</button>
      <button id="stats-most-played">Most played</button>
      <button id="stats-most-skipped">Most skipped</button>
      <button id="stats-never-played">Never played</button>
    </section>

    <form id="search-form">
      <input id="query" type="text" placeholder='Try: "upbeat 90s tracks but not metal"' autofocus />
      <button type="submit">Search</button>
    </form>
    <div id="search-history"></div>
    <div id="results-header" hidden>
      <button id="play-all-btn">Play all</button>
      <button id="playlist-all-btn">+ Playlist</button>
    </div>
    <div id="context-banner" hidden></div>
    <ul id="results"></ul>
    <button id="load-more-btn" hidden>Load more</button>
  </main>

  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script src="/static/app.js"></script>
</body>
</html>
